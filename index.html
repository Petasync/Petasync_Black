<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Disable Cloudflare Rocket Loader — it rewrites type="module" scripts
         and breaks React's Suspense/lazy-loading, causing removeChild crashes -->
    <meta http-equiv="x-cf-rocket-loader" content="off" />

    <!-- Critical inline CSS for instant render -->
    <style>
      /* Critical above-the-fold styles */
      body { margin: 0; background: #050505; color: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #root { min-height: 100vh; }
      /* Loading spinner — lives OUTSIDE #root so React never touches it */
      #loading-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; position: fixed; inset: 0; z-index: 9999; background: #050505; transition: opacity 0.3s; }
      #loading-screen.hidden { opacity: 0; pointer-events: none; }
      .spinner { width: 48px; height: 48px; border: 2px solid rgba(255,255,255,0.1); border-top-color: rgba(255,255,255,0.6); border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <!-- Favicon: multiple formats so Google/Browsers den korrekten Petasync-Logo finden.
         Reihenfolge wichtig: ICO zuerst (Google bevorzugt /favicon.ico), dann PNG, dann SVG.
         Das Web-App-Manifest wird vom VitePWA-Plugin im Build automatisch eingehängt. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <meta name="theme-color" content="#050505" />

    <!-- DNS Prefetch for external domains -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">

    <!-- Preconnect to critical domains only -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Async font loading - not render blocking -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>

    <title>Petasync - IT-Service & PC-Reparatur</title>
    <meta name="description" content="Petasync - Ihr IT-Partner für PC-Reparatur, IT-Support und Webdesign in Ansbach, Nürnberg und Umgebung" />
    <meta name="author" content="Petasync" />

    <!--
      Analytics (GA4) and Turnstile are loaded via React:
      - GA4/Clarity: src/lib/analytics.ts (initAnalytics) + CookieBanner consent
      - Turnstile: loaded on-demand by Kontakt form
      Removed inline scripts that conflicted with react-helmet-async
      and caused "removeChild" DOM errors.
    -->

    <!-- Social Meta Tags -->
    <meta property="og:title" content="Petasync - IT-Service & PC-Reparatur" />
    <meta property="og:description" content="Petasync - Ihr IT-Partner für PC-Reparatur, IT-Support und Webdesign in Ansbach, Nürnberg und Umgebung" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://petasync.de/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@petasync" />
    <meta name="twitter:image" content="https://petasync.de/og-image.png" />
  </head>

  <body>
    <!-- Loading screen lives OUTSIDE #root so React never touches it -->
    <div id="loading-screen">
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <!--
      Fix for React "removeChild" / "insertBefore" crashes.
      Browser extensions (ad blockers, password managers, translators) and
      third-party scripts (GTM, Clarity) can modify the DOM that React owns.
      When React then tries to remove/move those nodes, it throws
      "NotFoundError: Failed to execute 'removeChild' on 'Node'".
      This patch makes those operations safe by checking parentage first.
      Must run BEFORE React loads (synchronous, non-module script).
      See: https://github.com/facebook/react/issues/11538
    -->
    <script data-cfasync="false">
    (function(){
      if(typeof Node==='undefined'||!Node.prototype)return;
      var oRC=Node.prototype.removeChild;
      Node.prototype.removeChild=function(c){
        if(c.parentNode!==this){
          console.warn('removeChild patched: node not a child');
          return c;
        }
        return oRC.apply(this,arguments);
      };
      var oIB=Node.prototype.insertBefore;
      Node.prototype.insertBefore=function(n,r){
        if(r&&r.parentNode!==this){
          console.warn('insertBefore patched: ref not a child');
          return n;
        }
        return oIB.apply(this,arguments);
      };
    })();
    </script>
    <!--
      Stale-SW watchdog. After a deploy, an old Service Worker can serve a
      cached index.html that references chunk hashes that no longer exist
      on the server. Result: 404 on the entry script, main.tsx never runs,
      the loading spinner stays forever (black screen).
      This watchdog detects that scenario and recovers by unregistering the
      SW, clearing caches and hard-reloading.
    -->
    <script data-cfasync="false">
    (function(){
      var FLAG='petasync_sw_recover';
      var TIMEOUT=15000;
      var recovered=false;
      function recover(reason){
        if(recovered)return;
        recovered=true;
        if(sessionStorage.getItem(FLAG)){
          console.warn('[sw-watchdog] already retried, giving up:',reason);
          return;
        }
        sessionStorage.setItem(FLAG,'1');
        console.warn('[sw-watchdog] recovering:',reason);
        var done=function(){window.location.reload();};
        if('serviceWorker' in navigator){
          navigator.serviceWorker.getRegistrations()
            .then(function(regs){return Promise.all(regs.map(function(r){return r.unregister();}));})
            .then(function(){
              if('caches' in window){
                return caches.keys().then(function(names){
                  return Promise.all(names.map(function(n){return caches.delete(n);}));
                });
              }
            })
            .catch(function(){})
            .then(done,done);
        }else{done();}
      }
      // Catch chunk load failures (script/link errors for /assets/*)
      window.addEventListener('error',function(e){
        var t=e&&e.target;
        if(!t||(t.tagName!=='SCRIPT'&&t.tagName!=='LINK'))return;
        var src=t.src||t.href||'';
        if(src&&src.indexOf('/assets/')!==-1)recover('chunk-error: '+src);
      },true);
      // Watchdog timer: if React hasn't signalled mount, recover
      setTimeout(function(){
        if(!window.__PRERENDER_READY)recover('mount-timeout');
      },TIMEOUT);
      // Clear flag after successful mount (gives React a moment after pageshow)
      window.addEventListener('pageshow',function(){
        setTimeout(function(){
          if(window.__PRERENDER_READY)sessionStorage.removeItem(FLAG);
        },2000);
      });
    })();
    </script>
    <script data-cfasync="false" type="module" src="/src/main.tsx"></script>
  </body>
</html>
